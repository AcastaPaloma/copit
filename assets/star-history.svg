<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title description">
  <title id="title">AcastaPaloma/copit star history</title>
  <desc id="description">A hand-drawn chart showing 0 stars on GitHub.</desc>
  <style>
    .background { fill: #fffdf7; stroke: #292524; stroke-width: 2; }
    .grid { fill: none; stroke: #d6d3d1; stroke-dasharray: 5 8; stroke-width: 1; }
    .axis { fill: none; stroke: #44403c; stroke-linecap: round; stroke-width: 2.2; }
    .history { fill: none; stroke: #f59e0b; stroke-linecap: round; stroke-linejoin: round; stroke-width: 5; }
    .marker { fill: #f59e0b; stroke: #92400e; stroke-width: 2; }
    .title { fill: #1c1917; font: 700 28px "Comic Sans MS", "Bradley Hand", cursive; }
    .subtitle { fill: #78716c; font: 17px "Comic Sans MS", "Bradley Hand", cursive; }
    .axis-label { fill: #78716c; font: 14px "Comic Sans MS", "Bradley Hand", cursive; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #1c1917; stroke: #e7e5e4; }
      .grid { stroke: #44403c; }
      .axis { stroke: #d6d3d1; }
      .title { fill: #fafaf9; }
      .subtitle, .axis-label { fill: #a8a29e; }
    }
  </style>
  <defs>
    <filter id="rough" x="-4%" y="-8%" width="108%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.08" numOctaves="2" seed="23" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <rect class="background" x="5" y="5" width="890" height="490" rx="22" />
  <text class="title" x="44" y="50">Star History</text>
  <text class="subtitle" x="44" y="78">AcastaPaloma/copit · 0 stars</text>
  <path class="grid" d="M 82 410.0 H 850" /> <path class="grid" d="M 82 349.0 H 850" /> <path class="grid" d="M 82 288.0 H 850" /> <path class="grid" d="M 82 227.0 H 850" /> <path class="grid" d="M 82 166.0 H 850" /> <path class="grid" d="M 82 105.0 H 850" />
  <path class="axis" filter="url(#rough)" d="M 82 105 V 410 H 850" />
  <text class="axis-label" x="66" y="415.0" text-anchor="end">0</text> <text class="axis-label" x="66" y="354.0" text-anchor="end">1</text> <text class="axis-label" x="66" y="293.0" text-anchor="end">2</text> <text class="axis-label" x="66" y="232.0" text-anchor="end">3</text> <text class="axis-label" x="66" y="171.0" text-anchor="end">4</text> <text class="axis-label" x="66" y="110.0" text-anchor="end">5</text>
  <text class="axis-label" x="82.0" y="444" text-anchor="middle">Launch</text> <text class="axis-label" x="850.0" y="444" text-anchor="middle">Latest</text>
  <path class="history" filter="url(#rough)" d="M 82 410.0 L 850 410.0" />
</svg>
