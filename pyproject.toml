[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copit"
version = "0.1.2"
license = "MIT"
license-files = ["LICENSE"]
description = "Capture and automatically name macOS screenshots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=12.3,<13",
    "pynput>=1.8.2,<2",
    "pyobjc-framework-Cocoa>=12.2.1,<13",
    "pyobjc-framework-Quartz>=12.2.1,<13",
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
    "transformers>=5.14,<6",
]
classifiers = [
    "Environment :: MacOS X",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/AcastaPaloma/copit"
Repository = "https://github.com/AcastaPaloma/copit"

[project.scripts]
copit = "main:run"

[tool.setuptools]
py-modules = ["main", "mathhelper", "ocr", "screenshothelper"]
